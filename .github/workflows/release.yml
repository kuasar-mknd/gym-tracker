name: Release

on:
    push:
        tags:
            - 'v*'

permissions:
    contents: write
    actions: read

jobs:
    # Ce qui garde la production, c'est cette etape — pas une branche.
    #
    # L'alternative etait une branche `prod` dans laquelle on ne fusionne que du
    # vert. Elle coute de la divergence, des conflits et des cherry-picks des le
    # premier correctif urgent, et elle pose la question de laquelle des deux
    # branches dit la verite. Ici `main` reste la seule verite, ce qui est en
    # production reste identifie par un tag — deja immuable — et la porte est un
    # controle, pas une reference git.
    #
    # Deux conditions, sur le commit exact que le tag designe :
    #   1. la CI est verte — sans quoi on publierait un commit dont on ne sait rien ;
    #   2. la passe nocturne est verte — c'est la qu'on met ce qui est trop lent
    #      pour bloquer chaque PR.
    promotion:
        name: Verifier que ce commit est promouvable
        runs-on: ubuntu-latest
        steps:
            - name: Exiger une CI et une nuit vertes sur ce commit
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  REPO: ${{ github.repository }}
                  SHA: ${{ github.sha }}
                  TAG: ${{ github.ref_name }}
              run: |
                  set -euo pipefail

                  # Interroge l'API plutot que de maintenir un marqueur : le
                  # resultat des runs EST la source de verite, et un marqueur
                  # aurait sa propre facon de mentir.
                  verte() {
                      local fichier="$1"
                      gh api "repos/$REPO/actions/workflows/$fichier/runs?head_sha=$SHA&status=success" \
                        --jq '.total_count' 2>/dev/null || echo 0
                  }

                  CI=$(verte "ci.yml")
                  NUIT=$(verte "mutation.yml")

                  echo "commit $SHA (tag $TAG) — runs verts : CI=$CI, nuit=$NUIT"

                  # Une ligne d'erreur par manque, plutot qu'un message
                  # assemble : `printf` sur une chaine construite mettrait la
                  # variable dans le format, et GitHub ne rend de toute facon
                  # pas les retours a la ligne dans une annotation ::error::.
                  PROMOUVABLE=1

                  if [ "$CI" -eq 0 ]; then
                      echo "::error::La CI n'a pas de run vert sur le commit $SHA."
                      PROMOUVABLE=0
                  fi

                  if [ "$NUIT" -eq 0 ]; then
                      echo "::error::La passe nocturne n'a pas de run vert sur le commit $SHA."
                      PROMOUVABLE=0
                  fi

                  if [ "$PROMOUVABLE" -eq 0 ]; then
                      echo ""
                      echo "La passe nocturne est planifiee a 03h17 UTC, mais GitHub la lance plusieurs heures"
                      echo "plus tard (entre 07h42 et 10h31 UTC du 1er septembre au 5 octobre 2026), sur la"
                      echo "pointe de main a ce moment. Si ce commit est encore la pointe de main quand la"
                      echo "prochaine passe planifiee part, elle le couvre : l'attendre. Pour ne pas attendre, ou"
                      echo "si main a avance, lancer la passe manquante sur le tag lui-meme :"
                      echo "  gh workflow run mutation.yml --ref $TAG"
                      echo "  gh workflow run ci.yml --ref $TAG"
                      echo ""
                      echo "La passe verte, relancer les jobs echoues du run de CI du tag (sa promotion"
                      echo "exige la meme passe), puis ce run :  gh run rerun $GITHUB_RUN_ID --failed"
                      exit 1
                  fi

    release:
        name: Create Release
        needs: promotion
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v7

            - name: Create Release
              uses: softprops/action-gh-release@v3
              if: startsWith(github.ref, 'refs/tags/')
              with:
                  generate_release_notes: true
                  draft: false
                  prerelease: false
