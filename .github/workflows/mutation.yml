name: Mutation testing

# Nocturne, et bloquant pour la mise en production.
#
# Le mutation testing rejoue les tests qui couvrent chaque ligne mutee : le cout
# se compte en dizaines de minutes, pas en secondes. Par PR ce n'est pas tenable
# — d'ou la nuit.
#
# Cette passe n'est plus informative. `ci.yml` refuse de publier l'image sous un
# tag `v*` si l'une de ses parts n'est pas verte, et la production suit l'image.
# Une nuit rouge bloque donc une livraison, et ouvre une issue
# (main-failure-issue.yml). C'est voulu : « tout doit etre vert » n'a de sens
# que si quelque chose peut etre rouge.
#
# Les seuils partent du niveau MESURE, pas d'un objectif. Un seuil qu'on
# n'atteint pas se desactive dans la semaine, et il reste une porte de plus qui
# ne garde rien. Ils doivent monter — c'est #1446, et c'est la meme methode qui
# a porte la couverture front de 23 % a 95 % par cliquets successifs.
on:
    schedule:
        # 03h17 UTC : decale de l'heure ronde, ou la file des runners planifies
        # de GitHub est la plus chargee.
        - cron: '17 3 * * *'
    workflow_dispatch:

permissions:
    contents: read

jobs:
    mutation:
        runs-on: ubuntu-latest
        # Mesure locale du perimetre entier en une seule passe : 5 776 s, soit
        # 96 minutes — et les runners GitHub sont plus lents que la machine qui
        # a servi a mesurer. Un job unique aurait ete un pari sur la marge.
        #
        # Decoupe par namespace : chaque part a son propre delai, une part lente
        # n'empeche pas les autres de publier, et fail-fast: false garantit
        # qu'une part qui deborde ne coupe pas celles qui tournent encore. La
        # passe de reference (~100 s) est repayee par part, ce qui est
        # negligeable devant la mutation elle-meme.
        #
        # Les delais suivent la mesure locale, avec une marge d'environ le
        # double parce que les runners GitHub sont plus lents que la machine qui
        # a servi a mesurer.
        #
        # Mesure en sequentiel, puis en parallele sur le meme perimetre :
        #
        #   App\Policies   714 s -> 319 s, score identique au mutant pres
        #                   (94,28 %, 313 tues, 19 survivants)
        #
        # Soit 2,2x. Les delais ci-dessous partent de la mesure parallele pour
        # Policies et d'une extrapolation du meme facteur pour les autres —
        # Services, mesure a 3 205 s en sequentiel, devrait tomber vers 24 min.
        # C'est une extrapolation, pas une mesure : d'ou 60 minutes et non 30.
        #
        # Un delai unique aurait ete cale sur Services et aurait laisse les
        # trois autres parts capables de tourner une heure sans que personne ne
        # s'en apercoive.
        timeout-minutes: ${{ matrix.timeout }}
        strategy:
            fail-fast: false
            matrix:
                include:
                    # Le seuil est le score mesure moins une marge, et cette
                    # marge n'est pas du confort : un mutant qui part en timeout
                    # compte comme non tue, et les runners GitHub sont plus lents
                    # que la machine qui mesure. Une porte qui bloque a tort est
                    # une porte qu'on desactive.
                    #
                    # Elle etait de deux points, posee au juge. Trois nocturnes
                    # VERTES consecutives disent qu'elle peut etre plus serree —
                    # c'est la mesure qui le dit, pas une intuition :
                    #
                    #                  21/08    22/08    23/08     min
                    #   App\Services   80,70    80,82    81,18    80,70
                    #   App\Actions    66,83    66,83    66,83    66,83
                    #   App\Policies   94,28    94,35    94,35    94,28
                    #
                    # `App\Actions` rend le MEME score au centieme trois fois de
                    # suite, et `App\Policies` varie de sept centiemes. L'ecart
                    # de Services tient en un demi-point. La variance que la
                    # marge de deux points anticipait ne se voit pas.
                    #
                    # Services passe donc de 78 a 80 : il gardait plus de deux
                    # points d'avance sur son propre plancher mesure, ce qui est
                    # exactement le « pour le moment » que #1446 existe pour
                    # empecher de devenir « pour toujours ».
                    #
                    # Actions et Policies ne bougent pas : leurs seuils sont deja
                    # a moins d'un point de leur plancher (0,83 et 0,28). Les
                    # remonter demanderait de rogner une marge que ces trois
                    # mesures ne suffisent pas a declarer inutile — et #1542 vient
                    # de toucher trois politiques, donc leur score n'a pas encore
                    # ete mesure sur le code d'aujourd'hui.
                    #
                    # App\DTOs ne figure pas ici : la mesure rend ZERO mutation.
                    # Ce sont des classes readonly a proprietes promues, il n'y
                    # a rien a muter. Une part qui ne genere aucun mutant ne dit
                    # rien et coute une passe de reference complete.
                    #
                    # SEUILS RELEVES le 2026-08-20, sur quatre nocturnes reels.
                    #
                    #                 16/08    17/08    19/08    20/08    26/08
                    #   Services      58,74    58,74    79,17    80,05    81,06
                    #   Actions       64,49    64,49    66,47    67,88    97,26
                    #   Policies      94,28    94,28    94,28    94,28    94,94
                    #
                    # Le bond d'Actions n'est pas une derive de mesure : c'est la
                    # campagne de #1446, qui a ferme 224 mutants sur 29 fichiers en
                    # deux vagues. Le nombre de mutants monte AUSSI (760 -> 800) :
                    # le perimetre est `--covered-only`, donc couvrir plus de lignes
                    # en fabrique plus.
                    #
                    # Le point qui autorise a serrer : le score est DETERMINISTE
                    # en CI. Code identique, score identique au centieme — les
                    # 16 et 17 aout le montrent sur les trois parts a la fois. La
                    # variance qu'on redoutait en local, et qui venait de la
                    # contention entre processus, n'existe pas ici : le runner
                    # n'a que deux processus et la duree de reference est mesuree
                    # dans les memes conditions que les mutants.
                    #
                    # D'ou une marge d'un point au plus, et souvent moins : le
                    # seuil se pose JUSTE SOUS la derniere mesure. 80 sous 80,05,
                    # 94 sous 94,28. Ce n'est pas de l'imprudence, c'est la
                    # consequence directe du determinisme : une marge n'assure
                    # que contre du bruit, et il n'y en a pas.
                    #
                    # Une phrase disait ici « deux points sous la plus basse des
                    # mesures recentes ». Elle ne decrivait aucune des trois
                    # valeurs — la plus basse mesure de Services etait 58,74 pour
                    # un seuil a 80 — et elle invitait a desserrer des portes qui
                    # serrent volontairement. Corrigee le 25/08 : ce fichier doit
                    # dire ce qu'il fait, sinon c'est le commentaire qu'on croit.
                    #
                    # Ce que cela implique, et qui est voulu : un PR qui fait
                    # descendre le score d'un dixieme bloque une livraison. La
                    # reponse est de tuer le mutant, pas de baisser le seuil —
                    # sans quoi il reste une porte de plus qui ne garde rien.
                    # C'est la raison d'etre de #1446.
                    - scope: 'App\Services'
                      timeout: 60
                      min: 80
                    # 95 et non 97, contrairement aux deux autres parts qui se posent
                    # a un point sous leur mesure. La raison est le nombre
                    # d'observations, pas la prudence : Services et Policies ont
                    # quatre nocturnes derriere elles, Actions en a UNE avec son
                    # corpus de tests neuf. Le determinisme du score est etabli pour
                    # du code deja mesure quatre fois, pas pour 1 465 lignes de tests
                    # ecrites hier, dont certaines figent une horloge et comptent des
                    # requetes.
                    #
                    # A resserrer a 97 apres deux nocturnes vertes de plus. Ce n'est
                    # pas une intention vague : 95 laisse passer une regression de
                    # deux points, la ou 66 en laissait passer trente.
                    # App\Actions : 24 min mesurees sur quatre nocturnes, puis 31 le
                    # 3 septembre (la part est plus couverte depuis #1692) et un job
                    # annule a 30. Quarante-cinq laisse la marge que 30 n'avait plus.
                    - scope: 'App\Actions'
                      timeout: 45
                      min: 95
                    # 99 sur une mesure a 100,00 %, 316 mutants tues sur 316.
                    #
                    # Les seize survivants qui restaient etaient tous la meme
                    # chose : la garde `instanceof \App\Models\User` que porte
                    # presque chaque methode n'etait exercee QUE par des
                    # utilisateurs de l'application. La remplacer par `true` ne
                    # faisait donc tomber aucune assertion, alors que c'est elle
                    # qui separe les deux chemins d'autorisation du modele : un
                    # utilisateur est juge sur ce qu'il POSSEDE, un
                    # administrateur de panneau sur ce qu'on lui a ACCORDE.
                    #
                    # 99 et non 100 pour la meme raison qu'Actions est a 95 : le
                    # nombre d'observations. La mesure a 100 est locale et
                    # unique. A resserrer a 100 apres deux nocturnes vertes — a
                    # 316 mutants, un seul survivant rend 99,68 %, donc 99
                    # laisse passer trois survivants la ou 94 en laissait
                    # passer dix-neuf.
                    - scope: 'App\Policies'
                      timeout: 30
                      min: 99
        services:
            mysql:
                image: mysql:8.4
                env:
                    MYSQL_ROOT_PASSWORD: password
                    MYSQL_USER: sail
                    MYSQL_PASSWORD: password
                    MYSQL_DATABASE: gym_tracker_testing
                ports:
                    - 3306:3306
                options: --health-cmd="mysqladmin ping -ppassword" --health-interval=10s --health-timeout=5s --health-retries=3
        steps:
            - name: Checkout code
              uses: actions/checkout@v7

            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.5'
                  extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, mysql, pdo_mysql, bcmath, soap, intl, readline
                  coverage: pcov
                  tools: composer:v2

            - name: Install PHP dependencies
              run: composer install --no-interaction --prefer-dist --no-progress

            - name: Setup Node
              uses: actions/setup-node@v7
              with:
                  node-version: 24
                  cache: npm

            # La passe de reference execute la suite entiere, dont les tests qui
            # rendent des pages Inertia et lisent le manifeste de Vite. Sans
            # build, ceux-la echouent et le score n'a plus de sens.
            - name: Build frontend assets
              run: |
                  npm ci
                  npm run build

            - name: Prepare Application
              run: |
                  cp .env.example .env
                  php artisan key:generate

            # `pest --parallel` s'attend a trouver une base par processus, la ou
            # `artisan test -p` les cree au passage. Les creer vides suffit :
            # Laravel les migre lui-meme au premier usage — verifie en les
            # vidant puis en relancant, 1885 tests passes.
            #
            # Le conteneur de service n'accorde a `sail` que gym_tracker_testing,
            # d'ou le GRANT sur le motif. Les tirets bas sont des jokers dans un
            # GRANT, d'ou l'echappement.
            #
            # Seize plutot que le nombre de coeurs du runner : en creer de trop
            # ne coute rien, en manquer une fait echouer la passe.
            - name: Provisionner les bases par processus
              env:
                  DB_HOST: 127.0.0.1
                  DB_PORT: 3306
              run: |
                  # shellcheck disable=SC2016 # les accents graves sont des guillemets d'identifiant MySQL
                  php -r '
                      $pdo = new PDO("mysql:host=127.0.0.1;port=3306", "root", "password");
                      for ($i = 1; $i <= 16; $i++) {
                          $pdo->exec("CREATE DATABASE IF NOT EXISTS `gym_tracker_testing_test_$i`");
                      }
                      $pdo->exec("GRANT ALL PRIVILEGES ON `gym\_tracker\_testing\_test\_%`.* TO \"sail\"@\"%\"");
                  '

            - name: Execute mutation testing
              env:
                  DB_CONNECTION: mysql
                  DB_HOST: 127.0.0.1
                  DB_PORT: 3306
                  DB_DATABASE: gym_tracker_testing
                  DB_USERNAME: sail
                  DB_PASSWORD: password
                  TELESCOPE_ENABLED: false
              # `vendor/bin/pest`, et non `php artisan test`.
              #
              # #1366 concluait « artisan test, jamais vendor/bin/pest », parce
              # que `pest --parallel` avait produit 1317 echecs. La conclusion
              # etait trop large : ce n'est pas `pest` qui casse, c'est
              # `pest --parallel` quand les bases par processus n'existent pas
              # encore. `artisan test -p` les cree au passage, pest les attend.
              # L'etape de provisionnement ci-dessus les cree, et Laravel les
              # migre lui-meme — verifie contre des bases vides : 1885 tests
              # passes.
              #
              # Le choix est force par --min : `artisan test --mutate --min=101`
              # rend exit 0 sur un score de 100 %, parce que son `--min` est
              # celui de la COUVERTURE et qu'il est silencieusement ignore ici.
              # `vendor/bin/pest --mutate --min=101` rend exit 1 avec le message
              # attendu. Sans ce binaire, le seuil ne serait qu'un ornement —
              # et cette passe garde la porte de mise en production.
              #
              # --covered-only : muter une ligne qu'aucun test ne couvre produit
              # un survivant qui ne dit rien de la qualite des tests, seulement
              # de leur absence — ce que la couverture mesure deja.
              #
              # Le perimetre exclut App\Filament et App\Http : les ressources
              # Filament sont surtout de la declaration, et les controleurs sont
              # couverts par des tests de bout en bout dont la mutation coute
              # cher pour un signal faible. La logique qui merite ce signal vit
              # dans les actions, les services et les policies.
              run: |
                  # Sans pipefail, le statut de l'etape serait celui de `tee`,
                  # donc toujours vert : le job ne bloque pas, mais il doit dire
                  # la verite dans l'interface.
                  set -o pipefail
                  vendor/bin/pest --mutate --parallel --covered-only \
                    --class='${{ matrix.scope }}' \
                    --min=${{ matrix.min }} \
                    | tee mutation-report.txt

            - name: Upload report
              if: always()
              uses: actions/upload-artifact@v7
              with:
                  # Un nom par part, sans quoi les quatre televersements se
                  # disputeraient le meme artefact.
                  name: mutation-report-${{ strategy.job-index }}
                  path: mutation-report.txt
                  retention-days: 30
