name: Auto-Merge

# Dependabot uniquement. Le job `user-merge`, qui fusionnait automatiquement
# toute PR de kuasar-mknd n'ayant qu'un seul auteur de commit, a ete retire :
# le travail humain ou assiste passe desormais par une relecture explicite.
# Seules les montees de dependances — donc les correctifs de securite — sont
# fusionnees sans intervention.

on: pull_request

permissions:
    contents: write
    pull-requests: write

jobs:
    dependabot:
        runs-on: ubuntu-latest
        if: github.event.pull_request.user.login == 'dependabot[bot]'
        steps:
            - name: Dependabot metadata
              id: metadata
              uses: dependabot/fetch-metadata@v3
              with:
                  github-token: '${{ secrets.GITHUB_TOKEN }}'

            - name: Approve and auto-merge Dependabot PRs
              if: |
                  steps.metadata.outputs.update-type == 'version-update:semver-patch' ||
                  steps.metadata.outputs.update-type == 'version-update:semver-minor'
              run: |
                  gh pr merge --auto --squash "$PR_URL"
              env:
                  PR_URL: ${{ github.event.pull_request.html_url }}
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
