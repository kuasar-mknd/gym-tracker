name: Avis hors-ligne

# Tenir fraiche la seule protection qui ne demande pas le reseau.
#
# Depuis #1546, `composer audit` tourne avec `--ignore-unreachable` : une panne
# de packagist ne bloque plus une livraison. Ce choix repose entierement sur le
# fait que la garantie ne vient pas de ce service seul — `composer.lock` porte
# `roave/security-advisories`, dont les conflits refusent un paquet vulnerable
# sans jamais rien demander au reseau.
#
# Cette garantie a une date, et personne ne la regardait. Mesure le 24/08 : la
# reference verrouillee datait du 07/08, et la rafraichir a fait passer les
# conflits de 1072 a 1076. Quatre avis n'etaient bloques par rien hors ligne, au
# moment precis ou l'on venait de rendre le regard en ligne non bloquant.
#
# La cause est mecanique. La contrainte est `dev-latest`, une version de
# developpement que Dependabot ne propose jamais : verifie sur l'historique du
# depot, ou toutes les mises a jour depuis l'installation du paquet le 20/01
# sont des effets de bord de `composer update` lances pour autre chose. Entre le
# 21/01 et le 11/08, l'ensemble d'avis est reste fige SEPT MOIS.
#
# Ce workflow ouvre la PR de rafraichissement lui-meme, mais SEULEMENT avec un
# jeton personnel (`AVIS_HORS_LIGNE_TOKEN`). Ce n'est pas un detail de confort :
# une PR ouverte avec `GITHUB_TOKEN` ne declenche pas `ci.yml` — GitHub supprime
# les evenements causes par son propre jeton — donc elle arriverait sans une
# seule porte verte, ce qu'un changement de `composer.lock` ne doit jamais etre.
#
# Sans le secret, le workflow retombe sur l'avertissement : il dit la commande a
# lancer et echoue passe quatorze jours. `LaGarantieHorsLigneNeVieillitPasTest`
# bloque la CI a trente. Deux seuils etages, pour que l'alarme arrive avant le
# mur — et le rafraichissement automatique, quand il tourne, fait qu'aucun des
# deux ne se declenche jamais.
#
# Le jeton demande deux droits sur ce depot seul : Contents (lecture/ecriture)
# pour pousser la branche, Pull requests (lecture/ecriture) pour ouvrir la PR.
# Rien d'autre — surtout pas Workflows.

on:
    schedule:
        # Lundi 05h41 UTC. Decale de l'heure ronde, comme la passe de mutation :
        # la file des runners planifies de GitHub y est la plus chargee. Lundi
        # parce qu'un avertissement recu en debut de semaine laisse la semaine
        # pour agir.
        - cron: '41 5 * * 1'
    workflow_dispatch:

permissions:
    contents: read

jobs:
    fraicheur:
        name: Fraicheur de l'ensemble d'avis
        runs-on: ubuntu-latest
        timeout-minutes: 10
        # Le secret passe par `env` parce que le contexte `secrets` n'est pas
        # lisible dans le `if` d'une etape. Vide quand il n'existe pas, ce qui
        # desactive proprement l'ouverture de la PR.
        env:
            JETON: ${{ secrets.AVIS_HORS_LIGNE_TOKEN }}
        steps:
            - name: Checkout code
              uses: actions/checkout@v7
              with:
                  # Le jeton sert au push : c'est lui qui decide si `ci.yml` se
                  # declenchera sur la PR. Absent, on retombe sur le jeton par
                  # defaut et l'etape d'ouverture se desactive d'elle-meme.
                  token: ${{ secrets.AVIS_HORS_LIGNE_TOKEN || github.token }}

            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.5'
                  extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, soap, intl, readline
                  coverage: none
                  tools: composer:v2

            # Ce que le verrou promet aujourd'hui, avant d'aller demander mieux.
            - name: Lire la garantie verrouillee
              id: verrou
              run: |
                  set -euo pipefail

                  lire() {
                      jq -r '
                          [(.packages + .["packages-dev"])[]
                              | select(.name == "roave/security-advisories")]
                          | .[0] // empty
                          | "\(.time)\t\(.conflict | length)"
                      ' composer.lock
                  }

                  ligne="$(lire)"

                  if [ -z "$ligne" ]; then
                      echo "::error::\`roave/security-advisories\` a disparu de composer.lock."
                      echo "C'est la seule protection qui ne demande pas le reseau, et le job" \
                           "\`audit\` de ci.yml compte dessus pour se permettre --ignore-unreachable."
                      exit 1
                  fi

                  date_avis="${ligne%%$'\t'*}"
                  conflits="${ligne##*$'\t'}"
                  jours=$(( ( $(date -u +%s) - $(date -u -d "$date_avis" +%s) ) / 86400 ))

                  {
                      echo "date=$date_avis"
                      echo "conflits=$conflits"
                      echo "jours=$jours"
                  } >>"$GITHUB_OUTPUT"

                  echo "Verrouille au $date_avis ($jours jours), $conflits conflits."

            # Le vrai audit hors-ligne : on demande a packagist si un avis PLUS
            # RECENT touche un paquet reellement installe. Si c'est le cas, la
            # resolution echoue — et c'est la toute la valeur de cette passe.
            # `composer audit` repond a la meme question, mais seulement quand il
            # est joignable, et seulement au moment d'une livraison.
            - name: Rafraichir l'ensemble d'avis
              run: |
                  set -euo pipefail

                  if ! composer update roave/security-advisories \
                          --no-interaction --no-scripts --no-audit 2>&1 | tee /tmp/refresh.log; then
                      echo "::error::La resolution a echoue en rafraichissant l'ensemble d'avis."
                      echo "Un avis publie depuis le ${{ steps.verrou.outputs.date }} entre en" \
                           "conflit avec une version installee : c'est une vulnerabilite qui" \
                           "touche ce depot, pas une panne d'outillage."
                      exit 1
                  fi

            # Une seule branche, reutilisee et poussee en force : au plus une
            # PR de rafraichissement a la fois, portant toujours l'etat le plus
            # recent. Une PR par semaine en laisserait cinq derriere soi le
            # premier mois, et personne ne les relirait.
            - name: Ouvrir la PR de rafraichissement
              id: pr
              if: ${{ env.JETON != '' }}
              env:
                  GH_TOKEN: ${{ env.JETON }}
                  BRANCHE: avis-hors-ligne/rafraichissement
                  DATE_AVANT: ${{ steps.verrou.outputs.date }}
                  JOURS_AVANT: ${{ steps.verrou.outputs.jours }}
                  CONFLITS_AVANT: ${{ steps.verrou.outputs.conflits }}
              run: |
                  set -euo pipefail

                  if git diff --quiet -- composer.lock; then
                      echo "Le verrou n'a pas bouge : rien a proposer."
                      echo 'ouverte=non' >>"$GITHUB_OUTPUT"
                      exit 0
                  fi

                  git config user.name 'github-actions[bot]'
                  git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
                  git checkout -B "$BRANCHE"
                  git add composer.lock

                  printf '%s\n' \
                      "chore(securite): rafraichir l'ensemble d'avis hors-ligne" \
                      "" \
                      "Rafraichissement automatique de roave/security-advisories, la seule" \
                      "protection qui ne demande pas le reseau. La contrainte etant dev-latest," \
                      "Dependabot ne la propose jamais et elle vieillit en silence : sept mois" \
                      "de gel entre janvier et aout 2026." \
                      "" \
                      "Verrou precedent : $DATE_AVANT ($JOURS_AVANT jours, $CONFLITS_AVANT conflits)." \
                      "" \
                      "Ouvert par .github/workflows/avis-hors-ligne.yml." \
                      >/tmp/message.txt

                  git commit -F /tmp/message.txt
                  git push --force-with-lease origin "$BRANCHE"

                  # `gh pr create` echoue si une PR existe deja sur cette
                  # branche ; le push l'aura simplement mise a jour.
                  existante="$(gh pr list --head "$BRANCHE" --state open --json number --jq '.[0].number // empty')"

                  if [ -z "$existante" ]; then
                      printf '%s\n' \
                          "Rafraichissement automatique hebdomadaire de \`roave/security-advisories\`." \
                          "" \
                          "Le verrou portait un ensemble d'avis date du **$DATE_AVANT** ($JOURS_AVANT jours, $CONFLITS_AVANT conflits). Tout avis publie depuis n'etait bloque par rien hors ligne — ce qui compte, puisque \`composer audit\` tourne avec \`--ignore-unreachable\` depuis #1546 et peut donc etre muet." \
                          "" \
                          "La contrainte est \`dev-latest\`, que Dependabot ne propose jamais : sans ce workflow, l'ensemble reste fige." \
                          "" \
                          "Ouverte par \`.github/workflows/avis-hors-ligne.yml\`. La CI tourne dessus normalement — c'est tout l'interet du jeton personnel." \
                          >/tmp/corps.md

                      gh pr create --base main --head "$BRANCHE" \
                          --title "chore(securite): rafraichir l'ensemble d'avis hors-ligne" \
                          --body-file /tmp/corps.md
                  fi

                  echo 'ouverte=oui' >>"$GITHUB_OUTPUT"

            - name: Comparer et decider
              run: |
                  set -euo pipefail

                  apres="$(jq -r '
                      [(.packages + .["packages-dev"])[]
                          | select(.name == "roave/security-advisories")]
                      | .[0] | "\(.time)\t\(.conflict | length)"
                  ' composer.lock)"

                  date_apres="${apres%%$'\t'*}"
                  conflits_apres="${apres##*$'\t'}"
                  avant='${{ steps.verrou.outputs.conflits }}'
                  jours='${{ steps.verrou.outputs.jours }}'

                  {
                      echo "### Garantie hors-ligne"
                      echo
                      echo "| | verrouille | disponible |"
                      echo "|---|---|---|"
                      echo "| date | ${{ steps.verrou.outputs.date }} | $date_apres |"
                      echo "| conflits | $avant | $conflits_apres |"
                      echo
                      echo "Age de la garantie verrouillee : **$jours jours**."
                  } >>"$GITHUB_STEP_SUMMARY"

                  if [ "$conflits_apres" -gt "$avant" ]; then
                      manquants=$(( conflits_apres - avant ))
                      echo "$manquants avis ne sont bloques par rien hors ligne." >>"$GITHUB_STEP_SUMMARY"
                  fi

                  # Quatorze jours : l'avertissement, pas le mur. Le mur est dans
                  # `LaGarantieHorsLigneNeVieillitPasTest`, a trente jours, et il
                  # bloque la CI. Avertir sur la moindre derive rendrait ce job
                  # rouge chaque semaine — roave publie presque tous les jours —
                  # et une porte qui bloque a tort est une porte qu'on desactive.
                  # Une PR ouverte rend l'avertissement inutile : le
                  # rafraichissement est deja propose, il ne reste qu'a le
                  # fusionner. On n'alerte que quand personne ne s'en occupe.
                  if [ '${{ steps.pr.outputs.ouverte }}' = 'oui' ]; then
                      echo 'PR de rafraichissement ouverte ou mise a jour.' >>"$GITHUB_STEP_SUMMARY"
                      exit 0
                  fi

                  if [ "$jours" -gt 14 ]; then
                      {
                          echo
                          echo "> **A rafraichir.** \`composer update roave/security-advisories\`"
                          echo "> puis ouvrir une PR : le test de convention passera au rouge a 30 jours."
                      } >>"$GITHUB_STEP_SUMMARY"

                      echo "::error::La garantie hors-ligne a $jours jours. Rafraichir : composer update roave/security-advisories"
                      exit 1
                  fi
