name: 'Stale'
on:
    schedule:
        - cron: '0 0 * * *'

# Seules les PR vieillissent. Les issues tiennent lieu de feuille de route
# (.ai/rules/general.md) : une issue de suivi peut rester un mois sans
# commentaire, et la fermer en « not planned » ne tranche rien (#1987).
# `issues: write` reste : l'API étiquette et commente une PR par ses routes
# d'issue.
permissions:
    issues: write
    pull-requests: write

jobs:
    stale:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/stale@v11
              with:
                  repo-token: ${{ secrets.GITHUB_TOKEN }}
                  days-before-issue-stale: -1
                  days-before-issue-close: -1
                  stale-pr-message: 'This PR is stale because it has been open 30 days with no activity. Remove stale label or comment or this will be closed in 10 days.'
                  stale-pr-label: 'no-pr-activity'
                  days-before-pr-stale: 30
                  days-before-pr-close: 10
