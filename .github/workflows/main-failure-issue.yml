name: Signaler un workflow rouge sur main

# Un rouge sur main qui n'interpelle personne finit par devenir le decor.
#
# Deux workflows sont surveilles, et pas seulement la CI :
#
#   CI               — ce qui casse sur main casse pour tout le monde.
#   Mutation testing — depuis qu'elle garde la porte de promotion, une nuit
#                      rouge BLOQUE la publication de l'image, donc le
#                      deploiement. Un blocage que personne ne voit se decouvre
#                      le jour ou l'on veut livrer, dans l'urgence.
#
# Une issue est ouverte, ou completee d'un commentaire si une issue est deja
# ouverte pour le meme workflow — sans quoi une semaine de rouge produirait sept
# issues identiques et on cesserait de les lire.
#
# Un run ANNULE se signale comme un run en echec. Un job qui depasse son
# `timeout-minutes` est annule, pas en echec, et la promotion d'un tag exige
# une passe reussie : une nuit annulee bloque la livraison comme une nuit
# rouge. Du 16 au 24/10, la part App\Services a depasse ses 45 minutes chaque
# nuit, neuf nuits annulees, et aucune issue ne s'est ouverte : le blocage
# s'est decouvert le jour de la release. Un arret a la main bloque la
# promotion de la meme facon.
#
# Seul un run annule SANS AUCUN JOB ne se signale pas : c'est le run de CI
# qu'un push plus recent a remplace pendant qu'il attendait son tour dans le
# groupe de concurrence de ci.yml (sur main, ci.yml n'annule jamais un run en
# cours, mais GitHub annule celui qui attend), comme le 03/10 quand trois
# fusions sont tombees dans le temps d'une CI. Il n'a rien teste et ne bloque
# rien : un tag a son propre groupe. Une part coupee par sa limite, elle, a un
# job annule.
#
# LIMITE CONNUE, ecrite ici pour qu'elle ne se redecouvre pas : une fusion faite
# avec le GITHUB_TOKEN — c'est le cas des PR Dependabot passees par auto-merge —
# ne declenche AUCUN run sur main. GitHub ne reveille pas les workflows pour un
# push effectue avec ce jeton. Il n'y a donc rien a signaler pour ces
# fusions-la, non parce qu'elles sont vertes mais parce qu'elles ne sont pas
# testees sur main du tout. Voir #1373, ou le meme mecanisme rendait la release
# automatique inoperante.
# Depuis #1672, auto-merge.yml fusionne avec le secret AUTO_MERGE_TOKEN (un PAT
# a granularite fine) quand il existe : ces fusions-la declenchent bien la CI.
on:
    workflow_run:
        workflows: ['CI', 'Mutation testing']
        types: [completed]
        branches: [main]

permissions:
    contents: read
    issues: write
    # Necessaire pour lire la liste des jobs du run en echec.
    actions: read

jobs:
    signaler:
        if: github.event.workflow_run.conclusion == 'failure' || github.event.workflow_run.conclusion == 'cancelled'
        runs-on: ubuntu-latest
        steps:
            - name: Ouvrir ou completer l'issue
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  REPO: ${{ github.repository }}
                  CONCLUSION: ${{ github.event.workflow_run.conclusion }}
                  RUN_ID: ${{ github.event.workflow_run.id }}
                  RUN_URL: ${{ github.event.workflow_run.html_url }}
                  SHA: ${{ github.event.workflow_run.head_sha }}
                  WORKFLOW: ${{ github.event.workflow_run.name }}
              run: |
                  set -euo pipefail

                  # Les jobs en echec, pas seulement le fait qu'il y en ait un :
                  # « laravel-tests » et « browser-tests » n'appellent pas la
                  # meme reaction, et le titre doit le dire sans avoir a ouvrir
                  # le run. Un job annule, le plus souvent par sa limite de
                  # temps, est nomme lui aussi, et dit l'etre.
                  NOMS=$(gh api "repos/$REPO/actions/runs/$RUN_ID/jobs" \
                    --jq '[.jobs[] | select(.conclusion == "failure" or .conclusion == "cancelled") | if .conclusion == "cancelled" then "\(.name) (annule)" else .name end]')
                  NOMBRE=$(jq 'length' <<<"$NOMS")

                  if [ "$CONCLUSION" = "cancelled" ] && [ "$NOMBRE" -eq 0 ]; then
                      echo "Run annule sans aucun job : remplace dans son groupe de concurrence, rien a signaler."
                      exit 0
                  fi

                  JOBS=$(jq -r 'join(", ")' <<<"$NOMS")
                  [ -n "$JOBS" ] || JOBS="cause inconnue"

                  # Le titre d'une issue tient en 256 caracteres, et le nom d'un
                  # job de matrice en fait jusqu'a cent : au-dela d'un job, le
                  # titre nomme le premier et compte les autres, et le corps les
                  # nomme tous. Trop long, le titre ferait refuser l'issue.
                  if [ "$NOMBRE" -gt 1 ]; then
                      EN_TITRE="$(jq -r '.[0]' <<<"$NOMS") et $((NOMBRE - 1)) autre(s)"
                  else
                      EN_TITRE="$JOBS"
                  fi

                  if [ "$CONCLUSION" = "cancelled" ]; then
                      ETAT_DU_RUN="a ete annule sur \`main\`, par la limite de temps d'un job (\`timeout-minutes\`) ou a la main. Une passe annulee n'est pas verte : la promotion attend une passe reussie."
                  else
                      ETAT_DU_RUN="a echoue sur \`main\`."
                  fi

                  BODY=$(cat <<EOF
                  **$WORKFLOW** $ETAT_DU_RUN

                  | | |
                  |---|---|
                  | jobs en echec ou annules | **$JOBS** |
                  | commit | \`$SHA\` |
                  | run | $RUN_URL |

                  Ouvert automatiquement parce que ce rouge **bloque la mise en
                  production**. La publication de l'image exige, sur le commit
                  exact du tag, une CI verte et une passe nocturne dont chaque
                  part est verte — et la production suit l'image.

                  Refermer en disant **pourquoi** c'etait rouge : un echec dont
                  personne n'a etabli la cause revient.
                  EOF
                  )

                  # Deduplique par label plutot que par titre : deux echecs de
                  # jobs differents restent le meme probleme tant que main est
                  # rouge, et sept issues identiques ne se lisent plus.
                  # Un label par workflow : une CI rouge et une nuit rouge sont
                  # deux problemes distincts, avec deux causes et deux
                  # responsables possibles. Les fondre dans une seule issue
                  # ferait perdre l'un des deux.
                  LABEL="ci-rouge-$(echo "$WORKFLOW" | tr '[:upper:] ' '[:lower:]-')"

                  EXISTANTE=$(gh issue list --repo "$REPO" --state open \
                    --label "$LABEL" --limit 1 --json number --jq '.[0].number // empty')

                  if [ -n "$EXISTANTE" ]; then
                      gh issue comment "$EXISTANTE" --repo "$REPO" --body "$BODY"
                      echo "Commente sur l'issue #$EXISTANTE."
                  else
                      gh label create "$LABEL" --repo "$REPO" \
                        --color B60205 --description "$WORKFLOW rouge sur main" 2>/dev/null || true

                      gh issue create --repo "$REPO" \
                        --title "ci: $WORKFLOW est rouge sur main — $EN_TITRE" \
                        --label "$LABEL" \
                        --body "$BODY"
                  fi
