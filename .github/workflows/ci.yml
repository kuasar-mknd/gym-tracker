name: CI

on:
    push:
        branches: ['main']
        tags: ['v*']
    pull_request:
        branches: ['main']

env:
    FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
    contents: read

# Une nouvelle poussee sur une PR annule le run precedent de la meme branche ;
# jamais sur main ni sur un tag, dont les runs promeuvent une image.
concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
    setup-php:
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - name: Checkout code
              uses: actions/checkout@v7

            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.5'
                  extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, soap, intl, readline
                  coverage: none
                  tools: composer:v2

            - name: Cache Vendor Folder
              id: vendor-cache
              uses: actions/cache@v6
              with:
                  path: vendor
                  key: ${{ runner.os }}-vendor-${{ hashFiles('**/composer.lock') }}

            - name: Install PHP Dependencies
              run: composer install --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist

    frontend-build:
        runs-on: ubuntu-latest
        timeout-minutes: 20
        steps:
            - name: Checkout code
              uses: actions/checkout@v7

            - name: Setup Node
              uses: actions/setup-node@v7
              with:
                  node-version: 24
                  cache: 'npm'

            - name: Install Node Dependencies
              run: npm ci

            # Runs here rather than in the `lint` job, which has no Node set up:
            # this one already installed it. Prettier only checks formatting, so
            # until eslint was added nothing checked the JavaScript itself.
            - name: Lint JS (Prettier + ESLint)
              run: npm run lint:js

            # --coverage rather than a bare run: the thresholds in vitest.config.js
            # are a ratchet on the frontend, which is the least-tested half of the
            # app. Without this step nothing stops a PR from removing JS tests.
            - name: Run JS Unit Tests (with coverage thresholds)
              run: npm run test:coverage

            - name: Build Assets
              run: npm run build

            - name: Upload Build Artifacts
              uses: actions/upload-artifact@v7
              with:
                  name: build-assets
                  path: |
                      public/build
                      public/sw.js
                  retention-days: 1

    laravel-tests:
        runs-on: ubuntu-latest
        timeout-minutes: 30
        needs: [setup-php, frontend-build]
        services:
            mysql:
                image: mysql:8.4
                env:
                    MYSQL_ROOT_PASSWORD: password
                    MYSQL_USER: sail
                    MYSQL_PASSWORD: password
                    MYSQL_DATABASE: gym_tracker_testing
                ports:
                    - 3306:3306
                options: --health-cmd="mysqladmin ping -ppassword" --health-interval=10s --health-timeout=5s --health-retries=3
        steps:
            - name: Checkout code
              uses: actions/checkout@v7

            - name: Create build directory
              run: mkdir -p public/build

            - name: Download Build Artifacts
              uses: actions/download-artifact@v8
              with:
                  name: build-assets
                  path: public

            - name: Verify Build Assets
              run: |
                  ls -la public/build
                  cat public/build/manifest.json || echo "Manifest not found"

            # Chaque entree du precache doit commencer par /build/ et exister sous
            # public/ : sans le prefixe, le worker demandait /assets/… (404) et n'a
            # jamais ete installe en production (#1683).
            - name: Verify Service Worker Precache
              run: |
                  node -e '
                    const fs = require("fs");
                    const sw = fs.readFileSync("public/sw.js", "utf8");
                    const urls = [...sw.matchAll(/"url":"([^"]+)"/g)].map((m) => m[1]);
                    if (urls.length === 0) { console.error("aucune entree de precache"); process.exit(1); }
                    const chemin = (u) => "public" + u.split("?")[0];
                    const mauvaises = urls.filter((u) => !(u.startsWith("/build/") || u === "/manifest.webmanifest") || !fs.existsSync(chemin(u)));
                    if (mauvaises.length) { console.error("entrees de precache invalides :", mauvaises.slice(0, 10)); process.exit(1); }
                    console.log(urls.length + " entrees de precache, toutes presentes sous public/");
                  '

            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.5'
                  extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, mysql, pdo_mysql, bcmath, soap, intl, readline
                  coverage: pcov
                  tools: composer:v2

            - name: Restore Vendor Folder
              id: vendor-cache
              uses: actions/cache@v6
              with:
                  path: vendor
                  key: ${{ runner.os }}-vendor-${{ hashFiles('**/composer.lock') }}
                  restore-keys: |
                      ${{ runner.os }}-vendor-

            # Cache absent ou partiel (composer.lock plus ancien) : on installe,
            # au lieu d'echouer trois etapes plus loin sur une classe introuvable.
            - name: Install PHP Dependencies (cache manquant)
              if: steps.vendor-cache.outputs.cache-hit != 'true'
              run: composer install --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist

            - name: Prepare Application
              run: |
                  cp .env.example .env
                  php artisan key:generate

            # The service container grants `sail` access to gym_tracker_testing only.
            # Paratest creates one shard database per process, so the user also needs
            # rights over the gym_tracker_testing_test_N pattern or every Feature test
            # fails with access denied. Underscores are GRANT wildcards, hence escaped.
            - name: Grant Paratest Shard Databases
              run: |
                  # shellcheck disable=SC2016 # the backticks are MySQL identifier quotes, not a subshell
                  php -r '(new PDO("mysql:host=127.0.0.1;port=3306", "root", "password"))->exec("GRANT ALL PRIVILEGES ON `gym\\_tracker\\_testing\\_test\\_%`.* TO \"sail\"@\"%\"");'

            - name: Execute tests
              env:
                  DB_CONNECTION: mysql
                  DB_HOST: 127.0.0.1
                  DB_PORT: 3306
                  DB_DATABASE: gym_tracker_testing
                  DB_USERNAME: sail
                  DB_PASSWORD: password
                  TELESCOPE_ENABLED: false
              # --min is a ratchet, not a target: it is pinned to the coverage the
              # suite actually had when it was introduced, so a PR cannot silently
              # delete tests. Raise it whenever coverage climbs; never lower it.
              run: php artisan test -p --coverage --min=94

    browser-tests:
        runs-on: ubuntu-latest
        timeout-minutes: 45
        needs: [setup-php, frontend-build]
        services:
            mysql:
                image: mysql:8.4
                env:
                    MYSQL_ROOT_PASSWORD: password
                    MYSQL_USER: sail
                    MYSQL_PASSWORD: password
                    MYSQL_DATABASE: gym_tracker_dusk
                ports:
                    - 3306:3306
                options: --health-cmd="mysqladmin ping -ppassword" --health-interval=10s --health-timeout=5s --health-retries=3
        steps:
            - name: Checkout code
              uses: actions/checkout@v7

            - name: Create build directory
              run: mkdir -p public/build

            - name: Download Build Artifacts
              uses: actions/download-artifact@v8
              with:
                  name: build-assets
                  path: public

            - name: Verify Build Assets
              run: |
                  ls -la public/build
                  cat public/build/manifest.json || echo "Manifest not found"

            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.5'
                  extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, mysql, pdo_mysql, bcmath, soap, intl, readline
                  coverage: none
                  tools: composer:v2

            - name: Restore Vendor Folder
              id: vendor-cache
              uses: actions/cache@v6
              with:
                  path: vendor
                  key: ${{ runner.os }}-vendor-${{ hashFiles('**/composer.lock') }}
                  restore-keys: |
                      ${{ runner.os }}-vendor-

            # Cache absent ou partiel (composer.lock plus ancien) : on installe,
            # au lieu d'echouer trois etapes plus loin sur une classe introuvable.
            - name: Install PHP Dependencies (cache manquant)
              if: steps.vendor-cache.outputs.cache-hit != 'true'
              run: composer install --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist

            - name: Install Chrome Driver
              run: php artisan dusk:chrome-driver --detect

            - name: Start Chrome Driver
              run: ./vendor/laravel/dusk/bin/chromedriver-linux --port=9515 &

            - name: Run Dusk Tests
              run: |
                  # Create fresh .env
                  cat <<EOF > .env
                  APP_NAME=GymTracker
                  APP_ENV=testing
                  APP_KEY=
                  APP_DEBUG=true
                  APP_URL=http://127.0.0.1:8000

                  DB_CONNECTION=mysql
                  DB_HOST=127.0.0.1
                  DB_PORT=3306
                  DB_DATABASE=gym_tracker_dusk
                  DB_USERNAME=sail
                  DB_PASSWORD=password

                  SESSION_DRIVER=database
                  CACHE_STORE=array
                  QUEUE_CONNECTION=sync
                  MAIL_MAILER=array

                  TELESCOPE_ENABLED=false
                  PULSE_ENABLED=false
                  DUSK_DRIVER_URL=http://127.0.0.1:9515
                  SANCTUM_STATEFUL_DOMAINS=127.0.0.1:8000
                  APP_RUNNING_BROWSER_TESTS=true
                  EOF

                  php artisan key:generate

                  # Dusk automatically uses .env.testing if present, we must override it
                  cp .env .env.testing
                  cp .env .env.dusk.local

                  chmod -R 777 storage bootstrap/cache
                  php artisan config:clear

                  php artisan migrate:fresh --seed --force

                  # Start server
                  # Quatre travailleurs pour le serveur PHP integre : Dusk enchaine
                  # pages, XHR et assets, et un seul processus les sert l'un apres
                  # l'autre — six minutes sur le chemin critique (#1672).
                  PHP_CLI_SERVER_WORKERS=4 php artisan serve --host=127.0.0.1 --port=8000 --no-reload > storage/logs/serve.log 2>&1 &

                  # Wait for server
                  timeout 30s bash -c 'until curl -s http://127.0.0.1:8000 > /dev/null; do sleep 1; done'

                  # Run dusk
                  php artisan dusk

            - name: Dump Logs on Failure
              if: failure()
              run: |
                  echo "--- Laravel Log ---"
                  tail -n 100 storage/logs/laravel.log || echo "No laravel log found"
                  echo "--- Serve Log ---"
                  cat storage/logs/serve.log || echo "No serve log found"

            - name: Upload Test Screenshots
              if: failure()
              uses: actions/upload-artifact@v7
              with:
                  name: dusk-screenshots
                  path: tests/Browser/screenshots

            - name: Upload Test Logs
              if: failure()
              uses: actions/upload-artifact@v7
              with:
                  name: dusk-console
                  path: tests/Browser/console

    lint:
        runs-on: ubuntu-latest
        timeout-minutes: 15
        needs: setup-php
        steps:
            - name: Checkout code
              uses: actions/checkout@v7

            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.5'
                  extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, soap, intl, readline
                  coverage: none
                  tools: composer:v2

            - name: Restore Vendor Folder
              id: vendor-cache
              uses: actions/cache@v6
              with:
                  path: vendor
                  key: ${{ runner.os }}-vendor-${{ hashFiles('**/composer.lock') }}
                  restore-keys: |
                      ${{ runner.os }}-vendor-

            # Cache absent ou partiel (composer.lock plus ancien) : on installe,
            # au lieu d'echouer trois etapes plus loin sur une classe introuvable.
            - name: Install PHP Dependencies (cache manquant)
              if: steps.vendor-cache.outputs.cache-hit != 'true'
              run: composer install --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist

            - name: PHP Lint (Pint)
              run: ./vendor/bin/pint --test

    # Ces trois jobs ne declarent volontairement AUCUN `needs:` : un job "skipped"
    # compte comme "passed" pour la protection de branche, donc le chainer derriere
    # un autre viderait la garantie qu'il est cense apporter.
    #
    # Ils n'ont pas non plus de `name:` : les contextes de protection de ce depot
    # sont les identifiants de job, pas des libelles. En ajouter un renommerait le
    # contexte et casserait le cablage des checks requis.
    semgrep:
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - name: Checkout code
              uses: actions/checkout@v7

            # Image officielle plutot que `pipx install semgrep` : la version est
            # deterministe et ne depend pas de ce que le runner embarque.
            - name: Semgrep (default + php + owasp-top-ten)
              run: |
                  docker run --rm -v "$PWD":/src -w /src semgrep/semgrep:1.176.0 \
                    semgrep scan --config p/default --config p/php --config p/owasp-top-ten \
                    --severity ERROR --error .

    secrets:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - name: Checkout code
              uses: actions/checkout@v7
              with:
                  # L'action TruffleHog fait un scan GIT, pas un scan du repertoire :
                  # sans l'historique complet, la SHA de base d'une PR est absente et
                  # l'action echoue. fetch-depth: 0 est donc obligatoire ici.
                  fetch-depth: 0

            - name: TruffleHog
              uses: trufflesecurity/trufflehog@main
              with:
                  path: ./
                  base: ''
                  head: ''
                  # --exclude-detectors=Lob n'est pas du confort : sans lui, un scan
                  # de l'historique complet remonte 25 faux positifs, tous des noms de
                  # methodes de test faisant exactement 40 caracteres, que le detecteur
                  # du service postal americain prend pour des cles. Avec le flag, zero
                  # resultat sur tout l'historique.
                  extra_args: --results=verified,unknown --exclude-detectors=Lob

    workflows:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - name: Checkout code
              uses: actions/checkout@v7

            - name: actionlint
              run: docker run --rm -v "$PWD":/repo:ro -w /repo rhysd/actionlint:1.7.12 -color

    audit:
        runs-on: ubuntu-latest
        timeout-minutes: 30
        needs: setup-php
        steps:
            - name: Checkout code
              uses: actions/checkout@v7

            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.5'
                  extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, soap, intl, readline
                  coverage: none
                  tools: composer:v2

            - name: Restore Vendor Folder
              id: vendor-cache
              uses: actions/cache@v6
              with:
                  path: vendor
                  key: ${{ runner.os }}-vendor-${{ hashFiles('**/composer.lock') }}
                  restore-keys: |
                      ${{ runner.os }}-vendor-

            # Cache absent ou partiel (composer.lock plus ancien) : on installe,
            # au lieu d'echouer trois etapes plus loin sur une classe introuvable.
            - name: Install PHP Dependencies (cache manquant)
              if: steps.vendor-cache.outputs.cache-hit != 'true'
              run: composer install --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist

            # Une panne du service d'avis ne bloque plus la livraison, et la
            # garantie ne s'en trouve pas affaiblie — parce qu'elle ne reposait
            # deja pas sur lui seul.
            #
            # Le 20/08, packagist a rendu un 502 et `composer audit` est sorti en
            # erreur 100 : le job `audit` est tombe, donc la CI, donc la
            # publication de l'image, sur un commit sans le moindre defaut. Une
            # porte de securite qui cede quand le reseau tousse n'est pas une
            # porte, c'est un alea — et une porte qui bloque a tort est une porte
            # qu'on finit par desactiver.
            #
            # `--ignore-unreachable` ne fait taire QUE l'injoignable : un avis
            # reellement recu continue de faire echouer le job.
            #
            # Et la seconde ligne, elle, ne parle a personne : `composer.lock`
            # porte `roave/security-advisories` avec **1072 conflits** declares,
            # appliques a chaque `composer install` (que la CI lance sans
            # `--no-dev`). Un paquet vulnerable ne s'installe donc pas, reseau ou
            # pas. `composer audit` est le second regard, pas le seul.
            #
            # Cette garantie a une date, et elle etait affirmee sans etre
            # verifiee : mesuree le 24/08, la reference verrouillee datait du
            # 07/08 et la rafraichir a ajoute 4 conflits. La contrainte est
            # `dev-latest`, que Dependabot ne propose pas — entre le 21/01 et le
            # 11/08, l'ensemble d'avis est reste fige sept mois. Elle est
            # desormais tenue par `LaGarantieHorsLigneNeVieillitPasTest` (qui
            # bloque a 30 jours) et par `avis-hors-ligne.yml` (qui previent a 14).
            - name: Composer Audit
              run: composer audit --ignore-unreachable

            # Bloquant : ce gate n'est vert que parce qu'un composer-unused.php
            # documente les deux seuls faux positifs. Il echoue aussi sur une
            # exclusion "zombie", donc le fichier reste force de suivre composer.json.
            # La spec commitee documentait 3 chemins sur 142 routes api/v1, figee
            # depuis janvier. La regenerer ne suffit pas : sans ce controle elle
            # rederive au premier endpoint ajoute. Le job echoue si le fichier
            # commite differe de ce que les annotations produisent.
            - name: Unused Composer Dependencies
              run: ./vendor/bin/composer-unused --no-progress

            # Le job audit n'avait aucun Node : npm audit resout depuis
            # package-lock.json, donc ni `npm ci` ni cache ne sont necessaires.
            - name: Setup Node
              uses: actions/setup-node@v7
              with:
                  node-version: 24

            # Sans --omit=dev : dans ce depot, plusieurs paquets marques dev dans le
            # lock sont bundles par Vite et partent bien au navigateur. Les exclure
            # rendrait le gate aveugle sur du code qui atteint la production.
            - name: NPM Audit
              run: npm audit --audit-level=high

            - name: PHP Insights
              run: ./vendor/bin/phpinsights analyse --no-interaction --min-quality=90 --min-complexity=90 --min-architecture=90 --min-style=90

            - name: Larastan Analysis
              run: ./vendor/bin/phpstan analyse --memory-limit=2G

            - name: Rector (Dry Run)
              run: ./vendor/bin/rector process --dry-run --no-progress-bar

    build:
        name: Build Image (${{ matrix.platform }})
        runs-on: ${{ matrix.runner }}
        timeout-minutes: 60
        needs: [laravel-tests, browser-tests, lint, audit]
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        strategy:
            matrix:
                include:
                    - runner: ubuntu-latest
                      platform: linux/amd64
                    - runner: ubuntu-24.04-arm
                      platform: linux/arm64
        permissions:
            contents: read
            packages: write
        env:
            REGISTRY: ghcr.io
            IMAGE_NAME: ${{ github.repository }}
        steps:
            - name: Checkout repository
              uses: actions/checkout@v7

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v4

            - name: Log in to the Container registry
              uses: docker/login-action@v4
              with:
                  registry: ${{ env.REGISTRY }}
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Extract metadata (tags, labels) for Docker
              id: meta
              uses: docker/metadata-action@v6
              with:
                  images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

            - name: Build and push by digest
              id: build
              uses: docker/build-push-action@v7
              with:
                  context: .
                  platforms: ${{ matrix.platform }}
                  labels: ${{ steps.meta.outputs.labels }}
                  outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
                  cache-from: type=gha,scope=build-${{ matrix.platform }}
                  cache-to: type=gha,mode=max,scope=build-${{ matrix.platform }}

            - name: Export digest
              run: |
                  mkdir -p /tmp/digests
                  digest="${{ steps.build.outputs.digest }}"
                  touch "/tmp/digests/${digest#sha256:}"

            - name: Upload digest
              uses: actions/upload-artifact@v7
              with:
                  name: digests-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}
                  path: /tmp/digests/*
                  if-no-files-found: error
                  retention-days: 1

    # La porte de promotion, posee sur ce qui compte vraiment.
    #
    # `release.yml` est garde par le meme controle, mais garder la release seule
    # ne protegeait rien : pousser un tag `v*` declenche DEUX workflows
    # independants — celui-ci, qui publie l'image, et release.yml, qui cree
    # l'objet release. La production tire `ghcr.io/.../gym-tracker:v1`
    # (docker-compose.prod.yml:43 et :130), c'est-a-dire un tag produit ICI.
    # L'image serait donc partie meme avec la release bloquee.
    #
    # Ne s'applique qu'aux tags : sur `main`, `merge` publie `latest` et
    # `sha-*`, que la production ne tire pas.
    promotion:
        if: startsWith(github.ref, 'refs/tags/v')
        runs-on: ubuntu-latest
        timeout-minutes: 15
        needs: build
        steps:
            - name: Exiger une passe nocturne verte sur ce commit
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  REPO: ${{ github.repository }}
                  SHA: ${{ github.sha }}
                  TAG: ${{ github.ref_name }}
              run: |
                  set -euo pipefail

                  # L'API des runs est la source de verite : un marqueur
                  # maintenu a la main aurait sa propre facon de mentir. La CI,
                  # elle, n'est pas interrogee — ce job en fait partie et ne
                  # tourne que si `build` a reussi.
                  RUN=$(gh api \
                    "repos/$REPO/actions/workflows/mutation.yml/runs?head_sha=$SHA" \
                    --jq '[.workflow_runs[] | select(.status == "completed")] | first | .id // empty')

                  if [ -z "$RUN" ]; then
                      echo "::error::Aucune passe nocturne terminee sur ce commit : l'image ne sera pas publiee sous ce tag."
                      echo ""
                      echo "Pour debloquer :  gh workflow run mutation.yml --ref $TAG"
                      echo ""
                      echo "La nuit tourne sur la pointe de main a 03h17 UTC. Un tag pose"
                      echo "apres elle n'est pas encore couvert : c'est voulu."
                      exit 1
                  fi

                  # Chaque part est verifiee individuellement, et non la
                  # conclusion du run.
                  #
                  # Un job portant `continue-on-error: true` echoue sans faire
                  # echouer son run : interroger `status=success` aurait donc
                  # laisse passer une nuit entierement rouge. Le reglage a ete
                  # retire du workflow nocturne, mais le controle ne doit pas
                  # dependre d'un reglage qui vit ailleurs et qu'un futur
                  # `continue-on-error` remettrait en silence.
                  ECHECS=$(gh api "repos/$REPO/actions/runs/$RUN/jobs" \
                    --jq '[.jobs[] | select(.conclusion != "success") | "\(.name) [\(.conclusion)]"] | join(", ")')

                  TOTAL=$(gh api "repos/$REPO/actions/runs/$RUN/jobs" --jq '.jobs | length')

                  echo "commit $SHA (tag $TAG) — passe nocturne $RUN : $TOTAL part(s)"

                  if [ "$TOTAL" -eq 0 ]; then
                      echo "::error::La passe nocturne $RUN ne declare aucune part. Un run vide n'est pas un run vert."
                      exit 1
                  fi

                  if [ -n "$ECHECS" ]; then
                      echo "::error::La passe nocturne n'est pas entierement verte : $ECHECS"
                      echo ""
                      echo "L'image ne sera pas publiee sous ce tag. Corriger, puis relancer :"
                      echo "  gh workflow run mutation.yml --ref $TAG"
                      exit 1
                  fi

                  echo "Les $TOTAL parts sont vertes."

    merge:
        runs-on: ubuntu-latest
        timeout-minutes: 15
        needs: [build, promotion]
        # `promotion` est saute hors des tags, et un `needs` saute sauterait
        # `merge` avec lui — donc `latest` ne serait plus publie sur main. La
        # condition accepte explicitement les deux etats acceptables, et rien
        # d'autre.
        if: always() && needs.build.result == 'success' && (needs.promotion.result == 'success' || needs.promotion.result == 'skipped')
        permissions:
            contents: read
            packages: write
        env:
            REGISTRY: ghcr.io
            IMAGE_NAME: ${{ github.repository }}
        steps:
            - name: Download digests (amd64)
              uses: actions/download-artifact@v8
              with:
                  name: digests-amd64
                  path: /tmp/digests

            - name: Download digests (arm64)
              uses: actions/download-artifact@v8
              with:
                  name: digests-arm64
                  path: /tmp/digests

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v4

            - name: Log in to the Container registry
              uses: docker/login-action@v4
              with:
                  registry: ${{ env.REGISTRY }}
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Extract metadata (tags, labels) for Docker
              id: meta
              uses: docker/metadata-action@v6
              with:
                  images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
                  tags: |
                      type=semver,pattern={{version}}
                      type=semver,pattern={{major}}.{{minor}}
                      type=semver,pattern=v{{major}}
                      type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
                      type=sha

            - name: Create manifest list and push
              working-directory: /tmp/digests
              run: |
                  # shellcheck disable=SC2046 # word splitting is intended: each digest and
                  # each tag must become its own argument. Quoting collapses them into one
                  # and breaks the multi-arch manifest.
                  docker buildx imagetools create $(printf '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@sha256:%s ' *) \
                  --tag ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest \
                  $(echo "${{ steps.meta.outputs.tags }}" | xargs -I {} echo "--tag {}")
