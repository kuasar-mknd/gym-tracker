x-app-env: &app-env
    APP_KEY: ${APP_KEY}
    APP_URL: ${APP_URL}
    ASSET_URL: ${APP_URL}
    APP_ENV: production
    APP_DEBUG: ${APP_DEBUG:-false}
    GOMAXPROCS: 2

    # Database
    DB_CONNECTION: mysql
    DB_HOST: db
    DB_PORT: 3306
    DB_DATABASE: ${DB_DATABASE}
    DB_USERNAME: ${DB_USERNAME}
    DB_PASSWORD: ${DB_PASSWORD}

    # Redis / Queue
    REDIS_HOST: redis
    REDIS_PASSWORD: ${REDIS_PASSWORD}
    REDIS_PORT: 6379
    SESSION_DRIVER: redis
    CACHE_STORE: redis
    QUEUE_CONNECTION: redis

    # Email Configuration
    MAIL_MAILER: smtp
    MAIL_HOST: ${MAIL_HOST}
    MAIL_PORT: ${MAIL_PORT}
    MAIL_USERNAME: ${MAIL_USERNAME}
    MAIL_PASSWORD: ${MAIL_PASSWORD}
    # Laravel lit MAIL_SCHEME, pas MAIL_ENCRYPTION, que rien ne lisait. Vide, le
    # schéma se déduit du port : smtps sur 465, smtp (STARTTLS si offert) ailleurs.
    MAIL_SCHEME: ${MAIL_SCHEME:-}
    MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS}
    MAIL_FROM_NAME: '${MAIL_FROM_NAME}'

    # Web Push : sans les deux clés, le navigateur ne peut pas s'abonner et rien
    # ne part ; vide, VAPID_SUBJECT retombe sur APP_URL. Les clés se génèrent une
    # fois (`npx web-push generate-vapid-keys`) ; en changer invalide tous les
    # abonnements existants.
    VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY}
    VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY}
    VAPID_SUBJECT: ${VAPID_SUBJECT}

    BACKUP_ARCHIVE_PASSWORD: ${BACKUP_ARCHIVE_PASSWORD:?mot de passe des archives de sauvegarde}

    # Une adresse ici, et chaque contrôle de santé qui passe au rouge écrit (une fois par heure au plus).
    HEALTH_TO_ADDRESS: ${HEALTH_TO_ADDRESS:-}

    # Les journaux vont dans `docker logs` ET dans un fichier par conteneur, sur
    # le volume `journaux` que lit le visualiseur du panneau. stderr seul ne
    # suffit pas : le planificateur lance chaque tâche avec sa sortie envoyée
    # dans /dev/null, et worker et scheduler écrivaient jusqu'ici dans un fichier
    # de leur propre conteneur, ni monté ni affiché (#1907).
    LOG_CHANNEL: stack
    LOG_STACK: stderr,daily
    LOG_LEVEL: ${LOG_LEVEL:-info}

    # Pulse écrit ses agrégats en base à chaque requête et chaque job : sur le
    # disque du NAS, 145 attentes de verrou en 205 s, toutes sur pulse_aggregates,
    # et aucune une fois coupé (mesures du 03/09, #1668). Coupé par défaut, comme
    # sur la pile déployée ; réglable dans la pile.
    PULSE_ENABLED: ${PULSE_ENABLED:-false}

services:
    app:
        image: ghcr.io/kuasar-mknd/gym-tracker:v1
        # Un conteneur garde l'image avec laquelle il a été créé : retélécharger
        # `:v1` ne met à jour aucun conteneur existant, et le scheduler du NAS a
        # ainsi tourné des semaines sur une vieille image (#1813). Toute mise à
        # jour de la pile retélécharge l'image et recrée ce qui a changé. Un
        # simple redémarrage, lui, ne télécharge rien.
        pull_policy: always
        volumes:
            - ${BACKUP_HOST_PATH:?dossier des sauvegardes sur l'hôte}:/app/storage/app/sauvegardes
            - journaux:/app/storage/logs
        restart: always
        ports:
            - 8888:80
        environment:
            <<: *app-env
            # Security & Admin
            ADMIN_ALLOWED_IPS: ${ADMIN_ALLOWED_IPS}
            # Le panneau Horizon et le seeder du premier administrateur ne
            # tournent que dans app. Sans ces deux lignes, les poser dans la pile
            # ne servait à rien : Horizon restait fermé à tous, et le seeder
            # échouait faute de mot de passe.
            HORIZON_ALLOWED_EMAILS: ${HORIZON_ALLOWED_EMAILS:-}
            ADMIN_INITIAL_PASSWORD: ${ADMIN_INITIAL_PASSWORD:-}
            # Server Optimization
            OCTANE_SERVER: frankenphp
            LOG_DAILY_NAME: app
        deploy:
            resources:
                limits:
                    memory: 1G
        healthcheck:
            test: ['CMD', 'curl', '-f', 'http://localhost:80/up']
            interval: 30s
            timeout: 5s
            start_period: 60s
            retries: 3
        networks:
            - frontend
            - backend
        depends_on:
            db:
                condition: service_healthy
            redis:
                condition: service_started

    db:
        image: mysql:8.4
        restart: always
        # Un disque dur synchronise chaque validation en 250 à 500 ms (310 ms par
        # écriture synchronisée, mesuré par dd sur le NAS le 03/09) ; le journal
        # est écrit à chaque validation et synchronisé une fois par seconde, au prix
        # d'une seconde d'écritures sur une coupure brutale. Aucune réplication ne
        # lit le journal binaire. La capacité d'entrée-sortie est celle d'un disque
        # dur partagé, pas le défaut calibré pour un SSD ; ces réglages sont ceux
        # appliqués et vérifiés sur la pile déployée (#1668).
        command: >
            --innodb-buffer-pool-size=256M
            --innodb-redo-log-capacity=256M
            --innodb-io-capacity=200
            --innodb-io-capacity-max=1000
            --innodb-flush-log-at-trx-commit=2
            --skip-log-bin
            --max-connections=50
            --key-buffer-size=32M
            --tmp-table-size=32M
            --max-heap-table-size=32M
        environment:
            MYSQL_DATABASE: ${DB_DATABASE}
            MYSQL_USER: ${DB_USERNAME}
            MYSQL_PASSWORD: ${DB_PASSWORD}
            MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
        volumes:
            - db_data:/var/lib/mysql
        deploy:
            resources:
                limits:
                    memory: 1G
        healthcheck:
            test: ['CMD', 'mysqladmin', 'ping', '-p${DB_PASSWORD}']
            interval: 15s
            retries: 5
            timeout: 5s
            start_period: 30s
        networks:
            - backend

    redis:
        image: redis:8-alpine
        restart: always
        command: >
            redis-server
            --requirepass ${REDIS_PASSWORD}
            --maxmemory 128mb
            --maxmemory-policy allkeys-lru
            --appendonly yes
            --appendfsync everysec
            --save 60 1000
        volumes:
            - redis_data:/data
        deploy:
            resources:
                limits:
                    memory: 256M
        healthcheck:
            test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD}', 'ping']
            interval: 15s
            timeout: 5s
            retries: 3
        networks:
            - backend

    worker:
        image: ghcr.io/kuasar-mknd/gym-tracker:v1
        pull_policy: always
        restart: always
        command: php artisan horizon
        volumes:
            - ${BACKUP_HOST_PATH:?dossier des sauvegardes sur l'hôte}:/app/storage/app/sauvegardes
            - journaux:/app/storage/logs
        environment:
            <<: *app-env
            LOG_DAILY_NAME: worker
        deploy:
            resources:
                limits:
                    memory: 512M
        healthcheck:
            test: ['CMD', 'php', 'artisan', 'horizon:status']
            interval: 60s
            timeout: 10s
            start_period: 30s
            retries: 3
        networks:
            - backend
        depends_on:
            db:
                condition: service_healthy
            redis:
                condition: service_healthy

    # Rien n'executait les taches planifiees.
    #
    # `routes/console.php` planifie `app:remind-training` en `->daily()`, et ce
    # fichier ne declarait que app, db, redis et worker — aucun service ne
    # lancait le planificateur. La commande n'a donc jamais tourne en
    # production, et le rappel quotidien n'a jamais ete envoye a personne.
    #
    # Rien ne pouvait le signaler : c'est un NON-EVENEMENT. Aucun test ne voit
    # qu'une tache planifiee ne s'execute pas — la suite verifie que la commande
    # marche quand on l'appelle, pas que quelque chose l'appelle. Et il n'y a
    # aucune erreur a remonter, seulement une absence (#1443).
    #
    # `schedule:work` plutot qu'un cron appelant `schedule:run` : il reste dans
    # le conteneur, se redemarre avec lui, et n'ajoute pas de crontab a tenir.
    scheduler:
        image: ghcr.io/kuasar-mknd/gym-tracker:v1
        pull_policy: always
        volumes:
            - ${BACKUP_HOST_PATH:?dossier des sauvegardes sur l'hôte}:/app/storage/app/sauvegardes
            - journaux:/app/storage/logs
        restart: always
        command: php artisan schedule:work
        environment:
            <<: *app-env
            LOG_DAILY_NAME: scheduler
        deploy:
            resources:
                limits:
                    memory: 256M
        healthcheck:
            test: ['CMD', 'php', 'artisan', 'schedule:list']
            interval: 60s
            timeout: 15s
            retries: 3
            start_period: 60s
        networks:
            - backend
        depends_on:
            db:
                condition: service_healthy
            redis:
                condition: service_healthy

networks:
    frontend:
    backend:
        internal: true

volumes:
    db_data:
    redis_data:
    # Un volume nommé neuf reprend le contenu et le propriétaire (www-data) du
    # dossier de l'image, sans le problème de droits d'un dossier de l'hôte.
    journaux:
