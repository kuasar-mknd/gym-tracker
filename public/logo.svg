<svg width="760" height="760" viewBox="247.5 243 760 760" xmlns="http://www.w3.org/2000/svg">
  <!--
    Le logo de l'application : le G hexagonal et ses trois barres, sans fond,
    pour une surface claire. Le panneau le sert tel quel ; l'application en
    trace le même dessin depuis resources/js/Utils/dessinDuLogo.js, sans
    requête. icone.svg le pose sur sa tuile, badge.svg le peint en blanc.

    Les couleurs sont les jetons color-logo-lettre et color-logo-barres de
    resources/css/app.css. Un SVG ne lit pas les variables CSS, d'où les
    valeurs en clair ; tests/Feature/IconesDeLApplicationTest.php les compare à
    la charte, et exige les mêmes tracés dans les quatre copies du dessin.
  -->
