    les barres qui gardent le dessin lisible. Le cadre est resserré sur le
    dessin, avec la marge d'un douzième que la barre d'état laisse autour d'une
    icône. Le worker sert badge-96x96.png, que pwa-assets.config.js en tire.
  -->
