<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!--
    L'icône de l'application : le dessin de logo.svg posé sur une tuile.

    La tuile est le jeton color-logo-fond de resources/css/app.css. Sans elle,
    la lettre bleu nuit disparaîtrait sur un onglet sombre, une barre des tâches
    sombre ou le volet des notifications d'un téléphone réglé en sombre : une
    seule apparence, lisible partout, plutôt qu'une variante par thème.

    Le dessin tient dans le cercle de 196 px de rayon centré sur la tuile, sous
    les 205 px de la zone sûre d'une icône masquable : le masque d'un lanceur ne
    rogne que la tuile. C'est l'icône d'onglet de la mise en page, et la source
    des PNG de public/, que pwa-assets.config.js en tire.
  -->
  <rect width="512" height="512" rx="100" fill="#ffffff"/>
  <svg x="48" y="48" width="416" height="416" viewBox="247.5 243 760 760">
    <g fill="#0f172a">
