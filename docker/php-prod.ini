[PHP]
memory_limit = 256M
upload_max_filesize = 10M
post_max_size = 12M
max_execution_time = 30
expose_php = Off
display_errors = Off
log_errors = On
error_reporting = E_ALL
; Une exception ne garde pas les arguments des appels de sa pile, code des
; paquets compris : ils recopieraient les valeurs reçues (champs, valeurs
; d'une requête SQL, jetons) dans les journaux, la table des exceptions et
; failed_jobs (#2032).
zend.exception_ignore_args = On

[opcache]
opcache.enable = 1
opcache.memory_consumption = 196
opcache.interned_strings_buffer = 24
opcache.max_accelerated_files = 10000
opcache.validate_timestamps = 0
opcache.save_comments = 1
opcache.jit = tracing
opcache.jit_buffer_size = 96M

[Session]
session.cookie_secure = 1
session.cookie_httponly = 1
session.cookie_samesite = Lax
