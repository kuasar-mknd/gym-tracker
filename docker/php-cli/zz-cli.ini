; OPcache de la ligne de commande, pour worker et scheduler seulement (#1968).
;
; Ces deux conteneurs ne font tourner que PHP en ligne de commande, où
; php-prod.ini laissait OPcache coupé : chaque démarrage d'artisan recompilait
; tout le code chargé. Il y en a environ cinq par minute (schedule:run, ses
; tâches et les sondes de santé).
;
; docker-compose.prod.yml charge ce dossier par PHP_INI_SCAN_DIR, après le
; dossier par défaut de l'image, donc après php-prod.ini. Le service app ne
; le charge pas : le serveur web hérite de son environnement et perdrait son
; JIT.
[opcache]
opcache.enable_cli = 1

; Chaque processus de la ligne de commande a sa propre mémoire partagée,
; perdue à sa sortie : seul le cache fichier sert d'un processus à l'autre.
; Le dossier doit exister et être inscriptible par www-data (Dockerfile) :
; sans lui, OPcache refuse de démarrer et toute commande PHP échoue.
opcache.file_cache = /tmp/opcache

; Avec le JIT « tracing » hérité de php-prod.ini, OPcache n'écrit jamais le
; cache fichier et compile la trace à chaque processus : les commandes
; deviennent plus lentes qu'avec OPcache coupé.
opcache.jit = disable

; config:cache et route:cache réécrivent bootstrap/cache à chaque démarrage
; du conteneur : un fichier dont la date a changé doit être relu, pas servi
; depuis le cache fichier d'un démarrage précédent.
opcache.validate_timestamps = 1
